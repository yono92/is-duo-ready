name: App suggestion or evidence / 앱·근거 제보
description: Suggest an app or provide a verifiable compatibility source.
title: '[App] '
body:
  - type: input
    id: app
    attributes:
      label: KR App Store URL
      description: 한국 스토어의 앱 주소 / Link to the app in the Korean store.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official sources / 공식 출처
      description: 개발사 또는 Apple의 URL과 관련 문장을 적어주세요. 없으면 확인 필요로 표시하세요.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / 추가 정보
      description: 지원 버전·직접 관찰·불확실한 부분을 구분해 주세요. 개인 정보와 비밀 값은 제외하세요.
