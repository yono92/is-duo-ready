name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  browser:
    name: Browser ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fixtures
            shard: 1/2
          - suite: fixtures
            shard: 2/2
          - suite: admin
            shard: 1/3
          - suite: admin
            shard: 2/3
          - suite: admin
            shard: 3/3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - if: matrix.suite == 'admin'
        run: npm run db:start && npm run db:env
      - run: npx playwright install --with-deps chromium
      # Each shard has its own runner, database and Next server. DB mutations
      # remain serial within a shard (playwright.admin.config.ts workers: 1).
      - if: matrix.suite == 'admin'
        run: npm run test:admin -- --shard=${{ matrix.shard }}
      - if: matrix.suite == 'fixtures'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.suite }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
      - if: always() && matrix.suite == 'admin'
        run: npm run db:stop

  production:
    name: Build, database and production boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run db:start && npm run db:env && npm run db:migrate
      - run: npm run test:db
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:production:db
      - if: always()
        run: npm run db:stop

  # Preserve the existing required check name while waiting for every gate.
  verify:
    if: always()
    needs: [checks, browser, production]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all verification jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$PRODUCTION_RESULT" = success
