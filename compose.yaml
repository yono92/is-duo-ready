name: duo-ready

services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      # Local development only. Never reuse these credentials for hosted databases.
      POSTGRES_DB: duo_ready
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duo_ready"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
